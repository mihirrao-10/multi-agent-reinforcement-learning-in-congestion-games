[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "congestion-marl"
version = "1.0.0"
description = "Independent multi-agent learning in an atomic Braess congestion game"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Mihir Rao" }]
dependencies = ["numpy==2.5.1"]

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[project.scripts]
congestion-marl = "congestion_marl.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
congestion_marl = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=congestion_marl --cov-report=term-missing --cov-fail-under=88"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true
